name: Build Targeted Photos Dyld Reference

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: "Direct Apple IPSW URL"
        required: true
        default: "https://updates.cdn-apple.com/2026FallFCS/d47bac10-cddf-4f79-a014-411e2fea1fdb/iPhone12%2C1_27.0_24A437_Restore.ipsw"

permissions:
  contents: read

concurrency:
  group: photos-targeted-dyld-reference
  cancel-in-progress: true

jobs:
  build:
    name: Build Targeted Photos Dyld Reference
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Show disk space
        run: df -h

      - name: Install latest ipsw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/blacktop/ipsw/releases/latest \
            | jq -r '.tag_name' \
            | sed 's/^v//'
          )"

          echo "Installing ipsw ${VERSION}"

          curl -fL \
            "https://github.com/blacktop/ipsw/releases/latest/download/ipsw_${VERSION}_linux_x86_64.tar.gz" \
            -o /tmp/ipsw.tar.gz

          tar -xzf /tmp/ipsw.tar.gz -C /tmp

          sudo install -m 0755 \
            /tmp/ipsw \
            /usr/local/bin/ipsw

          ipsw version

      - name: Install extraction dependencies
        env:
          APFS_FUSE_SHA: 66b86bd525e8cb90f9012543be89b1f092b75cf3
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            fuse3 \
            libfuse3-dev \
            libbz2-dev \
            libattr1-dev \
            zlib1g-dev \
            cmake \
            g++ \
            git \
            zip \
            unzip

          SRC="$RUNNER_TEMP/apfs-fuse"

          git clone --quiet \
            https://github.com/sgan81/apfs-fuse.git \
            "$SRC"

          git -C "$SRC" checkout --quiet "$APFS_FUSE_SHA"

          git -C "$SRC" \
            submodule update \
            --init \
            --recursive \
            --quiet

          cmake \
            -S "$SRC" \
            -B "$SRC/build" \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build "$SRC/build" \
            --parallel "$(nproc)"

          sudo install -m 0755 \
            "$SRC/build/apfs-fuse" \
            /usr/local/bin/apfs-fuse

          command -v apfs-fuse

      - name: Create working directories
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dsc"
          mkdir -p "$GITHUB_WORKSPACE/reference/binaries"
          mkdir -p "$GITHUB_WORKSPACE/reference/analysis"
          mkdir -p "$GITHUB_WORKSPACE/reference/imports"
          mkdir -p "$GITHUB_WORKSPACE/reference/headers"
          mkdir -p "$GITHUB_WORKSPACE/reference/swift"
          mkdir -p "$GITHUB_WORKSPACE/reference/dependencies"
          mkdir -p "$GITHUB_WORKSPACE/reference/focused"
          mkdir -p "$GITHUB_WORKSPACE/reference/photos-app"
          mkdir -p "$GITHUB_WORKSPACE/temp"

      - name: Extract arm64e dyld cache
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          set -euo pipefail

          ipsw extract \
            --remote \
            --device iPhone12,1 \
            --dyld \
            --dyld-arch arm64e \
            --output "$GITHUB_WORKSPACE/dsc" \
            "$IPSW_URL"

          echo
          echo "=== DSC FILES ==="

          find "$GITHUB_WORKSPACE/dsc" \
            -type f \
            -exec ls -lh {} \;

      - name: Locate primary dyld cache
        id: cache
        run: |
          set -euo pipefail

          CACHE="$(
            find "$GITHUB_WORKSPACE/dsc" \
              -type f \
              -name 'dyld_shared_cache_arm64e' \
              -print \
              -quit
          )"

          if [ -z "$CACHE" ]; then
            echo "ERROR: dyld_shared_cache_arm64e not found."
            exit 1
          fi

          echo "Primary cache:"
          echo "$CACHE"

          echo "cache_path=$CACHE" >> "$GITHUB_OUTPUT"

      - name: Save target image list
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt" <<'EOF'
          /System/Library/PrivateFrameworks/PhotosUICore.framework/PhotosUICore
          /System/Library/PrivateFrameworks/PhotosUIPrivate.framework/PhotosUIPrivate
          /System/Library/PrivateFrameworks/Tungsten.framework/Tungsten
          /System/Library/PrivateFrameworks/GridZero.framework/GridZero
          /System/Library/PrivateFrameworks/PhotosUIFoundation.framework/PhotosUIFoundation
          /System/Library/PrivateFrameworks/PhotosSwiftUICore.framework/PhotosSwiftUICore
          /System/Library/PrivateFrameworks/PhotosUIComponents.framework/PhotosUIComponents
          EOF

          sed -i 's/^          //' \
            "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt"

          cat \
            "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt"

      - name: Extract seven target Mach-O binaries
        env:
          CACHE: ${{ steps.cache.outputs.cache_path }}
        run: |
          set -euo pipefail

          STATUS="$GITHUB_WORKSPACE/reference/EXTRACTION_STATUS.txt"

          : > "$STATUS"

          while IFS= read -r IMAGE; do

            [ -n "$IMAGE" ] || continue

            NAME="$(basename "$IMAGE")"

            echo
            echo "======================================"
            echo "Extracting $NAME"
            echo "$IMAGE"
            echo "======================================"

            mkdir -p \
              "$GITHUB_WORKSPACE/reference/binaries/$NAME"

            if ipsw dyld extract \
              "$CACHE" \
              "$IMAGE" \
              --objc \
              --stubs \
              --force \
              --output "$GITHUB_WORKSPACE/reference/binaries/$NAME"
            then

              echo "$NAME: EXTRACTED" \
                | tee -a "$STATUS"

            else

              echo "$NAME: FAILED" \
                | tee -a "$STATUS"

            fi

          done < "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt"

          echo
          cat "$STATUS"

      - name: Verify target binaries
        run: |
          set -euo pipefail

          {
            echo "TARGET BINARY VERIFICATION"
            echo

            find "$GITHUB_WORKSPACE/reference/binaries" \
              -type f \
              -print0 \
            | while IFS= read -r -d '' FILE; do

                echo "======================================"
                echo "$FILE"

                file "$FILE" || true
                ls -lh "$FILE"

              done

          } > "$GITHUB_WORKSPACE/reference/BINARY_VERIFICATION.txt"

          cat \
            "$GITHUB_WORKSPACE/reference/BINARY_VERIFICATION.txt"

      - name: Generate deep Mach-O analysis
        env:
          CACHE: ${{ steps.cache.outputs.cache_path }}
        run: |
          set +e

          while IFS= read -r IMAGE; do

            [ -n "$IMAGE" ] || continue

            NAME="$(basename "$IMAGE")"

            echo
            echo "Analyzing $NAME"

            ipsw dyld macho \
              "$CACHE" \
              "$IMAGE" \
              --loads \
              --objc \
              --objc-refs \
              --symbols \
              --strings \
              --starts \
              --stubs \
              --swift \
              --swift-all \
              > "$GITHUB_WORKSPACE/reference/analysis/${NAME}_FULL_ANALYSIS.txt" \
              2>&1

          done < "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt"

          exit 0

      - name: Generate import maps
        env:
          CACHE: ${{ steps.cache.outputs.cache_path }}
        run: |
          set +e

          while IFS= read -r IMAGE; do

            [ -n "$IMAGE" ] || continue

            NAME="$(basename "$IMAGE")"

            echo "Imports: $NAME"

            ipsw dyld imports \
              "$CACHE" \
              "$IMAGE" \
              > "$GITHUB_WORKSPACE/reference/imports/${NAME}_IMPORTS.txt" \
              2>&1

          done < "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt"

          exit 0

      - name: Generate Objective-C headers
        env:
          CACHE: ${{ steps.cache.outputs.cache_path }}
        run: |
          set +e

          while IFS= read -r IMAGE; do

            [ -n "$IMAGE" ] || continue

            NAME="$(basename "$IMAGE")"

            OUT="$GITHUB_WORKSPACE/reference/headers/$NAME"

            mkdir -p "$OUT"

            echo
            echo "Class dump: $NAME"

            ipsw class-dump \
              "$CACHE" \
              "$IMAGE" \
              --headers \
              -o "$OUT" \
              > "$GITHUB_WORKSPACE/reference/headers/${NAME}_CLASS_DUMP_LOG.txt" \
              2>&1

          done < "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt"

          exit 0

      - name: Generate Swift metadata dumps
        env:
          CACHE: ${{ steps.cache.outputs.cache_path }}
        run: |
          set +e

          while IFS= read -r IMAGE; do

            [ -n "$IMAGE" ] || continue

            NAME="$(basename "$IMAGE")"

            OUT="$GITHUB_WORKSPACE/reference/swift/$NAME"

            mkdir -p "$OUT"

            echo
            echo "Swift dump: $NAME"

            ipsw swift-dump \
              "$CACHE" \
              "$IMAGE" \
              --demangle \
              --extra \
              --deps \
              -o "$OUT" \
              > "$GITHUB_WORKSPACE/reference/swift/${NAME}_SWIFT_DUMP_LOG.txt" \
              2>&1

          done < "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt"

          exit 0

      - name: Build direct private dependency map
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/reference/dependencies/DIRECT_PRIVATE_DEPENDENCIES.txt"

          grep -rhoE \
            '/System/Library/PrivateFrameworks/[A-Za-z0-9_.+-]+\.framework/[A-Za-z0-9_.+-]+' \
            "$GITHUB_WORKSPACE/reference/analysis" \
            | sort -u \
            > "$OUT" \
            || true

          echo
          echo "=== DIRECT PRIVATE DEPENDENCIES ==="

          cat "$OUT" || true

          echo
          echo "Count:"

          wc -l "$OUT"

      - name: Build complete dylib dependency path inventory
        run: |
          set -euo pipefail

          grep -rhoE \
            '/(System|usr)/[^ )"]+\.(framework/[A-Za-z0-9_.+-]+|dylib)' \
            "$GITHUB_WORKSPACE/reference/analysis" \
            | sort -u \
            > "$GITHUB_WORKSPACE/reference/dependencies/ALL_REFERENCED_DYLIB_PATHS.txt" \
            || true

          cat \
            "$GITHUB_WORKSPACE/reference/dependencies/ALL_REFERENCED_DYLIB_PATHS.txt"

      - name: Analyze direct private dependencies
        env:
          CACHE: ${{ steps.cache.outputs.cache_path }}
        run: |
          set +e

          INPUT="$GITHUB_WORKSPACE/reference/dependencies/DIRECT_PRIVATE_DEPENDENCIES.txt"

          [ -f "$INPUT" ] || exit 0

          COUNT=0

          while IFS= read -r IMAGE; do

            [ -n "$IMAGE" ] || continue

            COUNT=$((COUNT + 1))

            if [ "$COUNT" -gt 80 ]; then
              echo "Dependency analysis safety cap reached at 80."
              break
            fi

            NAME="$(
              echo "$IMAGE" \
                | sed 's#^/##' \
                | tr '/ ' '__'
            )"

            echo
            echo "Dependency analysis:"
            echo "$IMAGE"

            ipsw dyld macho \
              "$CACHE" \
              "$IMAGE" \
              --loads \
              --symbols \
              --starts \
              --stubs \
              > "$GITHUB_WORKSPACE/reference/dependencies/${NAME}_ANALYSIS.txt" \
              2>&1

          done < "$INPUT"

          exit 0

      - name: Build second-level private dependency map
        run: |
          set -euo pipefail

          grep -rhoE \
            '/System/Library/PrivateFrameworks/[A-Za-z0-9_.+-]+\.framework/[A-Za-z0-9_.+-]+' \
            "$GITHUB_WORKSPACE/reference/dependencies" \
            | sort -u \
            > "$GITHUB_WORKSPACE/reference/dependencies/SECOND_LEVEL_PRIVATE_DEPENDENCIES.txt" \
            || true

          echo
          echo "=== SECOND LEVEL PRIVATE DEPENDENCIES ==="

          cat \
            "$GITHUB_WORKSPACE/reference/dependencies/SECOND_LEVEL_PRIVATE_DEPENDENCIES.txt" \
            || true

      - name: Generate focused Viewer Grid Zoom Selection evidence
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/reference/focused/PHOTOS_VIEWER_GRID_ZOOM_SELECTION_EVIDENCE.txt"

          : > "$OUT"

          find "$GITHUB_WORKSPACE/reference" \
            -type f \
            \( -name '*.txt' -o -name '*.h' -o -name '*.swift' \) \
            -print0 \
          | while IFS= read -r -d '' FILE; do

              MATCHES="$(
                grep -Ein \
                  'PUOneUp|OneUp|currentAssetReference|currentAsset|scrubber|filmstrip|pageSwipe|paging|fractional|pageProgress|transitionProgress|interactiveTransition|PUNavigationTransition|PXGAnimator|PXGPPTAnimationLayout|zoomLevel|setZoomLevel|transitionToZoomLevel|zoomStep|interactiveZoom|focal|anchor|fixpoint|PXRectScale|PXMatrixMakeScale|PXSectionedSelectionManager|PXSelectionCoordinator|PXSelectionSnapshot|selectionGeometry|selectionManager|gridLayout|GridZero|PhotosGrid|visibleRect|contentOffset|layoutTransition|LayoutMetricInterpolator|BarsLayout|ChromeEnvironment|OneUpChrome' \
                  "$FILE" \
                  2>/dev/null \
                || true
              )"

              if [ -n "$MATCHES" ]; then

                echo >> "$OUT"
                echo "==================================================" >> "$OUT"
                echo "SOURCE: ${FILE#$GITHUB_WORKSPACE/reference/}" >> "$OUT"
                echo "==================================================" >> "$OUT"
                echo "$MATCHES" >> "$OUT"

              fi

            done

          echo
          echo "Focused evidence lines:"

          wc -l "$OUT"

      - name: Generate ownership-focused evidence
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/reference/focused/OWNERSHIP_AND_COORDINATION_EVIDENCE.txt"

          grep -RinE \
            'Manager|Coordinator|Controller|ViewModel|Interaction|Gesture|Animator|Transition|Pager|Scrubber|Selection|Zoom|Chrome|OneUp|AssetReference' \
            "$GITHUB_WORKSPACE/reference/headers" \
            "$GITHUB_WORKSPACE/reference/analysis" \
            "$GITHUB_WORKSPACE/reference/swift" \
            > "$OUT" \
            || true

          wc -l "$OUT"

      - name: Extract Photos.app reference
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          set +e

          ipsw extract \
            --remote \
            --device iPhone12,1 \
            --files \
            --pattern '.*/Photos\.app/.*' \
            --output "$GITHUB_WORKSPACE/reference/photos-app" \
            "$IPSW_URL" \
            > "$GITHUB_WORKSPACE/reference/photos-app/EXTRACTION_LOG.txt" \
            2>&1

          STATUS=$?

          echo "Photos.app extraction status: $STATUS"

          find "$GITHUB_WORKSPACE/reference/photos-app" \
            -type f \
            -exec ls -lh {} \; \
            > "$GITHUB_WORKSPACE/reference/photos-app/FILE_INVENTORY.txt" \
            2>&1

          exit 0

      - name: Create master reference report
        run: |
          set -euo pipefail

          REPORT="$GITHUB_WORKSPACE/reference/REFERENCE_INFO.txt"

          {
            echo "APPLE PHOTOS TARGETED DYLD REFERENCE"
            echo
            echo "Device: iPhone 11"
            echo "Product: iPhone12,1"
            echo "OS: iOS 27.0"
            echo "Build: 24A437"
            echo "Architecture: arm64e"
            echo
            echo "Purpose:"
            echo "Targeted architectural and binary reference for reproducing"
            echo "Apple Photos interaction behavior using public APIs."
            echo
            echo "PRIMARY TARGETS:"
            cat "$GITHUB_WORKSPACE/reference/TARGET_IMAGES.txt"
            echo
            echo "EXTRACTION STATUS:"
            cat "$GITHUB_WORKSPACE/reference/EXTRACTION_STATUS.txt"
            echo
            echo "DIRECT PRIVATE DEPENDENCY COUNT:"
            wc -l \
              "$GITHUB_WORKSPACE/reference/dependencies/DIRECT_PRIVATE_DEPENDENCIES.txt"
            echo
            echo "SECOND LEVEL PRIVATE DEPENDENCY COUNT:"
            wc -l \
              "$GITHUB_WORKSPACE/reference/dependencies/SECOND_LEVEL_PRIVATE_DEPENDENCIES.txt"
            echo
            echo "PACKAGE CONTENTS:"
            echo "- Real extracted Mach-O binaries for 7 Photos private frameworks"
            echo "- Full load/symbol/string/ObjC/Swift/stub/start analysis"
            echo "- Import maps"
            echo "- Objective-C class-dump headers"
            echo "- Swift metadata dumps where available"
            echo "- Direct private dependency analysis"
            echo "- Second-level private dependency inventory"
            echo "- Focused Viewer/Grid/Zoom/Selection evidence"
            echo "- Photos.app extraction attempt/reference"
            echo
            echo "NOTE:"
            echo "No private Apple framework is intended to be linked into the product."
            echo "This package is a behavioral/architectural reference."

          } > "$REPORT"

          cat "$REPORT"

      - name: Validate seven required frameworks
        run: |
          set -euo pipefail

          REQUIRED=(
            "PhotosUICore"
            "PhotosUIPrivate"
            "Tungsten"
            "GridZero"
            "PhotosUIFoundation"
            "PhotosSwiftUICore"
            "PhotosUIComponents"
          )

          STATUS="$GITHUB_WORKSPACE/reference/EXTRACTION_STATUS.txt"

          FAILED=0

          for NAME in "${REQUIRED[@]}"; do

            if grep -Fxq "$NAME: EXTRACTED" "$STATUS"; then

              echo "PASS: $NAME"

            else

              echo "FAIL: $NAME"
              FAILED=1

            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            echo "Required target extraction incomplete."
            exit 1
          fi

          echo
          echo "ALL SEVEN TARGET FRAMEWORKS EXTRACTED"

      - name: Show targeted reference size
        run: |
          set -euo pipefail

          echo "=== DIRECTORY SIZE ==="

          du -sh "$GITHUB_WORKSPACE/reference"

          echo
          echo "=== LARGEST FILES ==="

          find "$GITHUB_WORKSPACE/reference" \
            -type f \
            -printf '%s %p\n' \
            | sort -nr \
            | head -30 \
            | numfmt \
                --field=1 \
                --to=iec

      - name: Package targeted reference
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/reference"

          zip -qry -9 \
            "$GITHUB_WORKSPACE/Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437.zip" \
            .

          cd "$GITHUB_WORKSPACE"

          sha256sum \
            Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437.zip \
            > Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437.zip.sha256

          echo
          echo "=== FINAL ZIP ==="

          ls -lh \
            Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437.zip

          echo
          echo "=== SHA-256 ==="

          cat \
            Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437.zip.sha256

      - name: Enforce upload-friendly package size
        run: |
          set -euo pipefail

          FILE="$GITHUB_WORKSPACE/Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437.zip"

          SIZE="$(
            stat -c '%s' "$FILE"
          )"

          echo "Final size in bytes: $SIZE"

          LIMIT=$((480 * 1024 * 1024))

          if [ "$SIZE" -gt "$LIMIT" ]; then

            echo
            echo "WARNING:"
            echo "Targeted bundle exceeds 480 MiB."
            echo "It will still be uploaded to GitHub Actions,"
            echo "but may be inconvenient for ChatGPT upload."

          else

            echo
            echo "PASS: package is under 480 MiB."

          fi

      - name: Upload targeted Photos reference
        uses: actions/upload-artifact@v4
        with:
          name: Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437
          path: |
            Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437.zip
            Apple_Photos_Targeted_DYLD_Reference_iOS27_24A437.zip.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Final disk space
        if: always()
        run: df -h
